# Isolated local Supabase only; no linked project and no remote credentials.
project_id = "sfstore-checkout-synthetic-staging"
[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54332
shadow_port = 54330
major_version = 15
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54333
[inbucket]
enabled = true
port = 54334
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://localhost:3107"
additional_redirect_urls = ["http://127.0.0.1:3107"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.rate_limit]
anonymous_users = 30
[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"
